# Nginx 反向代理配置文件
# 用于在生产环境中将前端和后端服务统一对外提供
server {
    # 监听 80 端口，处理 HTTP 请求
    listen 80;
    # 服务器域名配置，支持主域名、www子域名和任意域名
    server_name antifraud2.tech www.antifraud2.tech _;

    # 设置客户端请求体最大大小为 20MB，用于支持文件上传等功能
    client_max_body_size 20m;

    # API 请求路由配置
    # 所有以 /api/ 开头的请求都会被转发到后端 Django 服务
    location /api/ {
        # 将请求代理到后端容器的 8000 端口
        proxy_pass http://backend:8000/api/;
        
        # 转发原始请求的 Host 头部
        proxy_set_header Host $host;
        # 转发客户端真实 IP 地址
        proxy_set_header X-Real-IP $remote_addr;
        # 添加 X-Forwarded-For 头部，记录代理链路中的所有 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 转发原始请求协议（http 或 https）
        proxy_set_header X-Forwarded-Proto $scheme;
        # 转发原始请求的主机名
        proxy_set_header X-Forwarded-Host $host;
        # 使用 HTTP/1.1 协议进行代理
        proxy_http_version 1.1;
        
        # CORS（跨域资源共享）配置
        # 允许来自请求源的跨域访问
        add_header Access-Control-Allow-Origin $http_origin always;
        # 允许携带认证信息（如 Cookie）
        add_header Access-Control-Allow-Credentials true always;
        # 允许的 HTTP 方法
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        # 允许的请求头
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        
        # 处理 CORS 预检请求（OPTIONS 方法）
        # 直接返回 204 状态码，表示允许跨域
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 前端应用路由配置
    # 除 /api/ 外的所有请求都转发到 Nuxt SSR 前端服务
    location / {
        # 将请求代理到前端容器的 3000 端口
        proxy_pass http://frontend:3000;
        
        # 转发原始请求头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # 使用 HTTP/1.1 协议
        proxy_http_version 1.1;
        # 支持 WebSocket 连接升级（用于热更新等功能）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 绕过缓存，确保获取最新内容
        proxy_cache_bypass $http_upgrade;
    }
}
